[project]
name = "msu-dem-dsm"
version = "0.3.0"
description = "Extract above-ground features from DEM and DSM rasters, independent of sea-level elevation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "numpy>=2.0,<3",
  "rasterio>=1.4.3,<2",
  "pillow>=11,<14",
  "pyshp>=2.3.1,<3",
  "shapely>=2.1,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
browser = ["playwright>=1.50,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
